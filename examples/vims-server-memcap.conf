# Example: systemd user drop-in capping a daemon that spawns memory-heavy
# subprocesses. Install to
#   ~/.config/systemd/user/<your-service>.service.d/memcap.conf
# then `systemctl --user daemon-reload && systemctl --user restart <svc>`.
#
# WHY: a single subprocess (here: a document archiver) peaked at 33GB on a
# 121GB GB10 and the kernel OOM-killed the system instead of the culprit.
# MemoryHigh makes the kernel reclaim/throttle; MemoryMax is the hard
# ceiling at which the cgroup OOM killer targets the biggest consumer
# INSIDE this unit -- not a random system process.
#
# Budget example for 121GB unified memory:
#   121 - 79 (main model) - 12 (embeddings) - 8 (system) = ~22GB
[Service]
MemoryHigh=16G
MemoryMax=22G
