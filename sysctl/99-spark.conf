# Larger socket buffers for local inference traffic.
net.core.rmem_max=16777216
net.core.rmem_default=16777216
net.core.wmem_max=16777216
net.core.wmem_default=16777216
# Electron/desktop + language servers + file watchers exhaust the default
# inotify instance cap quickly on a dev workstation.
fs.inotify.max_user_instances=8192
