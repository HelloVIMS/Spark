# spark.conf -- site config for the vLLM guardrails.
# Installed to ~/.config/spark/spark.conf by install.sh. This file is
# sourced by bash, so keep values shell-safe.

# Directory that relative VLLM_MODEL names resolve under.
MODELS_DIR="$HOME/models"

# vllm executable. Absolute path pins a specific venv and is recommended:
# a resolver-order change can otherwise pick the wrong install.
# VLLM_BIN="$HOME/venv/bin/vllm"

# Ceiling on the summed --gpu-memory-utilization across all running vLLM
# servers. On unified memory this is a share of TOTAL system RAM.
#   0.55  headroom for browser/Electron test runs
#   0.65  normal desktop development
#   0.80  inference-heavy, expect swap under desktop load
VLLM_MEM_BUDGET="0.80"

# Fraction of CPU cores pinned to each vLLM process (taskset). The rest
# stays reserved for the desktop, IDE, daemons and test harnesses.
VLLM_CPU_SHARE="0.80"
